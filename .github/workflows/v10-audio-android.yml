name: Build 8 Audio APK

on:
  workflow_dispatch:
  push:
    branches: [v10-audio]
    paths:
      - "V10-Audio/**"
      - ".github/workflows/v10-audio-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V10-Audio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8-Audio-debug-apk
          path: V10-Audio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
